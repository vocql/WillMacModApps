<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will Mac | Report a User</title>
<meta name="description" content="Report a rule-breaker to the Will Mac moderators. No login needed. Your report is anonymous and only moderators can read it.">
<meta name="theme-color" content="#ff4fb8">
<link rel="icon" href="https://images.guns.lol/637041cec591a6ab27615f0e2db44d08f3ce0c55/p6IK2p.webp">
<style>
:root{--pink:#ff4fb8;--pink2:#ff8fd4;--violet:#8b5cf6;--bg:#14092a;--border:rgba(255,255,255,.12);--text:#f7eefc;--muted:#b9a6d3;--ok:#3ddc97;--bad:#ff6b8b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,rgba(255,79,184,.2),transparent),radial-gradient(900px 500px at 100% 0,rgba(139,92,246,.22),transparent),var(--bg);color:var(--text);font:16px/1.5 'Outfit',system-ui,sans-serif;padding:24px 16px 60px}
.wrap{max-width:620px;margin:0 auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top img{width:44px;height:44px;border-radius:50%}.top a{color:var(--pink2);text-decoration:none;margin-left:auto;font-size:.9rem}
.card{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
h1{margin:0 0 4px;font-size:1.6rem}p.lead{color:var(--muted);margin:0 0 18px}
label{display:block;margin:14px 0 5px;font-weight:600;font-size:.9rem}label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;background:rgba(8,3,20,.85);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--pink)}textarea{min-height:130px;resize:vertical}
button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:99px;background:linear-gradient(90deg,var(--pink2),var(--pink));color:#2a0a22;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.thumbs .t{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs button{position:absolute;top:3px;right:3px;width:22px;height:22px;margin:0;padding:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:.8rem;line-height:1}
input[type=file]{padding:8px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.err{color:var(--bad);margin-top:12px;min-height:1.2em}
.priv{margin-top:14px;font-size:.82rem;color:var(--muted)}.done{text-align:center;padding:20px 6px}.done .tick{font-size:3rem}.done code{display:inline-block;background:rgba(0,0,0,.35);padding:3px 12px;border-radius:8px;font-size:1.1rem;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img id="logo" alt="" src="https://images.guns.lol/637041cec591a6ab27615f0e2db44d08f3ce0c55/p6IK2p.webp"><b>Will Mac Community</b><a href="../">← Back to home</a></div>
  <div class="card" id="box">
    <h1>Report a user</h1>
    <p class="lead">No login needed. Reports are anonymous and only visible to moderators, including reports about people who are already banned.</p>
    <form id="f" novalidate>
      <label for="target">Who are you reporting? <small>(Discord username or user ID)</small></label>
      <input id="target" maxlength="100" autocomplete="off" required>
      <label for="cat">What happened?</label>
      <select id="cat"><option value="harassment">Harassment</option><option value="spam">Spam</option><option value="inappropriate">Inappropriate content</option><option value="scam">Scam</option><option value="cheating">Cheating</option><option value="ban_evasion">Ban evasion</option><option value="other">Something else</option></select>
      <label for="det">Details <small>(at least 10 characters)</small></label>
      <textarea id="det" maxlength="2000" required></textarea>
      <label for="where">Where did it happen? <small>(optional)</small></label>
      <input id="where" maxlength="200">
      <label for="evi">Evidence link <small>(optional, e.g. a screenshot link)</small></label>
      <input id="evi" maxlength="800">
      <label for="img">Screenshots <small>(optional, up to 6 images)</small></label>
      <input id="img" type="file" accept="image/png,image/jpeg,image/webp" multiple>
      <div class="thumbs" id="thumbs"></div>
      <label for="con">Contact <small>(optional, only if you want a moderator to reach you)</small></label>
      <input id="con" maxlength="100">
      <div class="hp" aria-hidden="true"><label>Leave empty<input id="hp" tabindex="-1" autocomplete="off"></label></div>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="go">Send report</button>
    </form>
    <p class="priv">We never ask for your Discord account. Do not include passwords or private information.</p>
  </div>
</div>
<script src="../config.js"></script>
<script>
(function(){
  var C=window.WM_CONFIG||{};
  var $=function(i){return document.getElementById(i)};
  if(C.logo&&$("logo"))$("logo").src=C.logo;
  var url=(C.supabaseUrl||"").replace(/\/+$/,""),key=C.supabaseKey||"";
  var MSG={target:"Please enter who you are reporting.",short:"Please describe what happened (at least 10 characters).",toobig:"Those images are too large. Try fewer or smaller screenshots.",busy:"We are receiving a lot of reports right now. Please try again in a few minutes.",failed:"Something went wrong. Please try again."};
  var IMGS=[];
  function shrink(file){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};im.onerror=function(){res(null)};im.src=fr.result};fr.onerror=function(){res(null)};fr.readAsDataURL(file)})}
  function drawThumbs(){var t=$("thumbs");t.innerHTML="";IMGS.forEach(function(u,i){var d=document.createElement("div");d.className="t";var im=document.createElement("img");im.src=u;im.alt="Screenshot "+(i+1);var b=document.createElement("button");b.type="button";b.textContent="×";b.title="Remove";b.onclick=function(){IMGS.splice(i,1);drawThumbs()};d.appendChild(im);d.appendChild(b);t.appendChild(d)})}
  $("img").addEventListener("change",function(){var fl=Array.prototype.slice.call(this.files).slice(0,6-IMGS.length),self=this;$("err").textContent="";Promise.all(fl.map(shrink)).then(function(r){r.forEach(function(u){if(u&&IMGS.length<6)IMGS.push(u)});if(r.some(function(u){return!u}))$("err").textContent="One file could not be read as an image.";self.value="";drawThumbs()})});
  $("f").addEventListener("submit",function(e){
    e.preventDefault();$("err").textContent="";
    if(!url||!key){$("err").textContent="Reports are not set up on this site yet.";return}
    var t=$("target").value.trim(),d=$("det").value.trim();
    if(t.length<2){$("err").textContent=MSG.target;return}
    if(d.length<10){$("err").textContent=MSG.short;return}
    $("go").disabled=true;$("go").textContent="Sending…";
    var ac=new AbortController(),to=setTimeout(function(){ac.abort()},15000);
    fetch(url+"/rest/v1/rpc/report_submit",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json",apikey:key,Authorization:"Bearer "+key},
      body:JSON.stringify({p_target:t,p_category:$("cat").value,p_details:d,p_where:$("where").value,p_evidence:$("evi").value,p_contact:$("con").value,p_hp:$("hp").value,p_images:IMGS})})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
    .then(function(x){
      clearTimeout(to);
      if(x.ok&&x.j&&x.j.ok){$("box").innerHTML='<div class="done"><div class="tick">✅</div><h1>Report received</h1><p class="lead">Thank you. A moderator will review it.</p><code>'+String(x.j.ref).replace(/[^A-Za-z0-9-]/g,"")+'</code><p class="priv">Keep this reference if you need to mention it later.</p><p><a style="color:#ff8fd4" href="../">Back to home</a></p></div>';return}
      $("err").textContent=MSG[x.j&&x.j.error]||MSG.failed;$("go").disabled=false;$("go").textContent="Send report";
    }).catch(function(){clearTimeout(to);$("err").textContent="Could not reach the server. Check your connection and try again.";$("go").disabled=false;$("go").textContent="Send report"});
  });
})();
</script>
</body>
</html>
